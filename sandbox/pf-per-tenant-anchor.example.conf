# ============================================================================================
# pf-per-tenant-anchor.example.conf  -  INERT EXAMPLE. NOT LOADED BY THE LAUNCHER. REQUIRES ROOT.
# ============================================================================================
# Reference ONLY, shipped beside confine-run.sh for TIER-B (operator-provisioned, out-of-band)
# per-tenant network isolation. confine-run.sh NEVER loads PF, NEVER calls pfctl, and NEVER
# elevates. An operator wires this manually, out of band, on a box they own.
#
# WHAT THIS BUYS / WHAT IT DOES NOT (honest ceiling):
#   macOS Seatbelt (SBPL) cannot pin egress to a remote proxy IP - its network filter only accepts
#   host "*" or "localhost" (verified 26.5.2 arm64). So egress control by REMOTE address must live
#   OUTSIDE Seatbelt, in PF, keyed by the tenant's uid. This is COARSER than a Linux netns: it is a
#   host-global firewall rule, it is root, and PF FLUSHES ITS RULES ON NETWORK CHANGES
#   (Wi-Fi switch, VPN up/down, sleep/wake) - so it must be reinstalled by a LaunchDaemon watching
#   for network changes, or it silently lapses. Durable per-tenant isolation remains Layer B / Linux.
#
# HOW AN OPERATOR WOULD USE IT (all steps root, OOB - NOT done by the launcher):
#   1) Put the tenant uid in the table below (must match dedicated-uid-provisioning.example.sh).
#   2) Anchor it from /etc/pf.conf:   anchor "agent-tenant/*"
#                                     load anchor "agent-tenant" from "/etc/pf.anchors/agent-tenant"
#   3) sudo pfctl -f /etc/pf.conf && sudo pfctl -e
#   4) Install a LaunchDaemon on a com.apple.system.config.network_change watch that re-runs step 3,
#      because PF state is dropped on network changes.
#
# ---- /etc/pf.anchors/agent-tenant (this file's real content) --------------------------------

# The single loopback proxy every confined tenant is allowed to reach (matches confine-run.sh
# --proxy 127.0.0.1:8443; the proxy process itself does all outbound + DNS on the tenant's behalf).
proxy_host = "127.0.0.1"
proxy_port = "8443"

# Per-tenant uids provisioned out of band (see dedicated-uid-provisioning.example.sh).
table <agent_tenants> persist { 601, 602, 603 }

# Default-deny all outbound for tenant uids, THEN allow only the loopback proxy port.
# `user` in PF matches the effective uid of the socket's owner - this is the uid selector.
block drop out proto { tcp udp } from any to any user <agent_tenants>
pass out quick proto tcp from any to $proxy_host port $proxy_port user <agent_tenants> keep state

# Belt-and-suspenders: explicitly deny the tenant's own DNS (UDP/53) so it cannot self-resolve;
# the loopback proxy is the only path off-box and it resolves names. (Seatbelt already denies
# UDP/53 inside the profile; this is the PF-layer echo of the same DNS-through-proxy contract.)
block drop out quick proto udp from any to any port 53 user <agent_tenants>

# RESIDUAL: uid-keyed PF is host-global and root; it is NOT a namespace. A compromised tenant that
# somehow changes its own uid would escape this rule set - which is exactly why the uid must be
# operator-provisioned and the launcher must never drop uid itself.
